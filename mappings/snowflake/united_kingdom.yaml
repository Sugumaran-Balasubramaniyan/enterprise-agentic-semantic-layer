id: SnowflakeUnitedKingdomMapping
version: "1.0.0"
owner: GlobalSure United Kingdom Data Office
platform: Snowflake
location: GB
data_products:
  - Customer360
  - PolicyMaster
  - ClaimsAnalytics
  - PremiumAnalytics
source:
  database: GLOBALSURE_UK
  schemas:
    customers: INSURANCE_CUSTOMER
    policies: INSURANCE_POLICY
    claims: INSURANCE_CLAIM
    premiums: INSURANCE_PREMIUM
fields:
  customer_id: {physical_name: CUSTOMER_KEY, concept: insurance:Customer, pii: true}
  policy_id: {physical_name: POLICY_KEY, concept: insurance:Policy, pii: false}
  claim_id: {physical_name: CLAIM_KEY, concept: insurance:Claim, pii: false}
  country: {physical_name: MARKET_CODE, concept: insurance:Country, pii: false}
  product: {physical_name: LINE_OF_BUSINESS, concept: insurance:InsuranceProduct, pii: false}
  status: {physical_name: CLAIM_STATUS, concept: insurance:ClaimStatus, pii: false}
  claim_date: {physical_name: DATE_OF_LOSS, concept: insurance:Claim, pii: false}
  incurred_loss_eur: {physical_name: INCURRED_LOSS_EUR, concept: insurance:IncurredLoss, pii: false}
  premium_eur: {physical_name: PREMIUM_EUR, concept: insurance:Premium, pii: false}
normalization:
  products:
    AUTO: insurance:MotorInsurance
    CAR: insurance:MotorInsurance
    insurance:MotorInsurance: insurance:MotorInsurance
    HOME: insurance:HomeInsurance
  statuses:
    OPEN: OPEN
    PENDING: PENDING
    SETTLED: SETTLED
    CANCELLED: CANCELLED
    DUPLICATE: DUPLICATE
    OPENED: OPEN
    CLOSED: SETTLED
lineage:
  physical_sources:
    - snowflake://GLOBALSURE_UK.INSURANCE_CLAIM
    - snowflake://GLOBALSURE_UK.INSURANCE_POLICY
  semantic_target: Group insurance vocabulary 1.0.0
