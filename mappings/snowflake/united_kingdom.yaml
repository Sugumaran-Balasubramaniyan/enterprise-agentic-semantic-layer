id: SnowflakeUnitedKingdomMapping
version: "1.0.0"
owner: SAP United Kingdom Data Office
platform: Snowflake
location: GB
data_products:
  - BusinessPartners
  - SalesOrders
  - ACDOCAFinancials
  - BillingAnalytics
source:
  database: SAP_ERP_UK
  schemas:
    business_partners: ERP_BUSINESS_PARTNER
    sales_orders: ERP_SALES_ORDER
    acdoca_financials: ERP_ACDOCA_FINANCIALS
    billing_documents: ERP_BILLING_DOCUMENT
fields:
  partner_id: {physical_name: PARTNER_KEY, concept: ciferp:BusinessPartner, pii: true}
  partner_name: {physical_name: PARTNER_NAME, concept: ciferp:BusinessPartner, pii: true}
  email: {physical_name: EMAIL_ADDRESS, concept: ciferp:BusinessPartner, pii: true}
  sales_order_id: {physical_name: SALES_ORDER_KEY, concept: ciferp:SalesOrder, pii: false}
  order_status: {physical_name: ORDER_STATUS, concept: ciferp:SalesOrder, canonical_subset: ciferp:ActiveSalesOrder, pii: false}
  effective_date: {physical_name: EFFECTIVE_DATE, concept: ciferp:SalesOrder, pii: false}
  expiry_date: {physical_name: EXPIRY_DATE, concept: ciferp:SalesOrder, pii: false}
  net_value_eur: {physical_name: NET_VALUE_EUR, concept: ciferp:BillingDocument, pii: false}
  journal_entry_id: {physical_name: JOURNAL_ENTRY_KEY, concept: ciferp:FinancialPosting, pii: false}
  country: {physical_name: MARKET_CODE, concept: ciferp:CompanyCode, pii: false}
  product: {physical_name: MATERIAL_GROUP, concept: ciferp:Product, pii: false}
  posting_status: {physical_name: POSTING_STATUS, concept: ciferp:PostingStatus, pii: false}
  posting_date: {physical_name: POSTING_DATE, concept: ciferp:FinancialPosting, pii: false}
  amount_in_company_currency_eur: {physical_name: DEBIT_LOSS_EUR, concept: ciferp:FinancialLoss, pii: false}
  billing_doc_id: {physical_name: BILLING_DOC_KEY, concept: ciferp:BillingDocument, pii: false}
  billing_date: {physical_name: BILLING_DATE, concept: ciferp:BillingDocument, pii: false}
  billed_amount_eur: {physical_name: BILLED_AMOUNT_EUR, concept: ciferp:BillingDocument, pii: false}
normalization:
  products:
    AUTO: ciferp:ProductAutomotive
    CAR: ciferp:ProductAutomotive
    ciferp:ProductAutomotive: ciferp:ProductAutomotive
    HOME: ciferp:ProductCommercial
  statuses:
    POSTED: POSTED
    CLEARED: CLEARED
    REVERSED: REVERSED
    DUPLICATE: DUPLICATE
  order_statuses:
    OPEN: RELEASED
    IN_FORCE: RELEASED
    RELEASED: RELEASED
    CLOSED: CLOSED
    CANCELLED: CANCELLED
lineage:
  physical_sources:
    - snowflake://SAP_ERP_UK.ERP_ACDOCA_FINANCIALS
    - snowflake://SAP_ERP_UK.ERP_SALES_ORDER
  semantic_target: SAP ERP vocabulary 1.0.0
