id: DatabricksFranceMapping
version: "1.0.0"
owner: GlobalSure France Data Office
platform: Databricks
location: FR
data_products:
  - Customer360
  - PolicyMaster
  - ClaimsAnalytics
  - PremiumAnalytics
source:
  catalog: globalsure_france
  schemas:
    customers: insurance_customer
    policies: insurance_policy
    claims: insurance_claim
    premiums: insurance_premium
fields:
  customer_id: {physical_name: customer_id, concept: insurance:Customer, pii: true}
  policy_id: {physical_name: policy_id, concept: insurance:Policy, pii: false}
  claim_id: {physical_name: claim_id, concept: insurance:Claim, pii: false}
  country: {physical_name: market_code, concept: insurance:Country, pii: false}
  product: {physical_name: product_code, concept: insurance:InsuranceProduct, pii: false}
  status: {physical_name: claim_state, concept: insurance:ClaimStatus, pii: false}
  claim_date: {physical_name: loss_date, concept: insurance:Claim, pii: false}
  incurred_loss_eur: {physical_name: incurred_amount, concept: insurance:IncurredLoss, pii: false}
  premium_eur: {physical_name: written_premium, concept: insurance:Premium, pii: false}
normalization:
  products:
    MOTOR: insurance:MotorInsurance
    MTR: insurance:MotorInsurance
    insurance:MotorInsurance: insurance:MotorInsurance
    HOME: insurance:HomeInsurance
  statuses:
    OUVERTE: OPEN
    EN_ATTENTE: PENDING
    REGLEE: SETTLED
    ANNULEE: CANCELLED
    DOUBLON: DUPLICATE
    OPEN: OPEN
    PENDING: PENDING
    SETTLED: SETTLED
    CANCELLED: CANCELLED
    DUPLICATE: DUPLICATE
lineage:
  physical_sources:
    - databricks://globalsure_france.insurance_claim
    - databricks://globalsure_france.insurance_policy
  semantic_target: Group insurance vocabulary 1.0.0
