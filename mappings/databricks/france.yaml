# Illustrative mapping only; this repository does not connect to Databricks.
id: DatabricksFranceMapping
version: "1.0.0"
owner: repository-maintained synthetic contract
platform: Databricks
location: FR
data_products:
  - BusinessPartners
  - SalesOrders
  - ACDOCAFinancials
  - BillingAnalytics
source:
  catalog: sap_erp_france
  schemas:
    business_partners: erp_business_partner
    sales_orders: erp_sales_order
    acdoca_financials: erp_acdoca_financials
    billing_documents: erp_billing_document
fields:
  partner_id: {physical_name: partner_id, concept: ciferp:BusinessPartner, pii: true}
  partner_name: {physical_name: partner_name, concept: ciferp:BusinessPartner, pii: true}
  email: {physical_name: email, concept: ciferp:BusinessPartner, pii: true}
  sales_order_id: {physical_name: sales_order_id, concept: ciferp:SalesOrder, pii: false}
  order_status: {physical_name: order_status_local, concept: ciferp:SalesOrder, canonical_subset: ciferp:ActiveSalesOrder, pii: false}
  effective_date: {physical_name: effective_date, concept: ciferp:SalesOrder, pii: false}
  expiry_date: {physical_name: expiry_date, concept: ciferp:SalesOrder, pii: false}
  net_value_eur: {physical_name: net_value, concept: ciferp:BillingDocument, pii: false}
  journal_entry_id: {physical_name: journal_entry_id, concept: ciferp:FinancialPosting, pii: false}
  country: {physical_name: market_code, concept: ciferp:CompanyCode, pii: false}
  product: {physical_name: product_code, concept: ciferp:Product, pii: false}
  posting_status: {physical_name: doc_state, concept: ciferp:PostingStatus, pii: false}
  posting_date: {physical_name: doc_date, concept: ciferp:FinancialPosting, pii: false}
  amount_in_company_currency_eur: {physical_name: debit_amount, concept: ciferp:FinancialLoss, pii: false}
  billing_doc_id: {physical_name: billing_doc_id, concept: ciferp:BillingDocument, pii: false}
  billing_date: {physical_name: billing_date, concept: ciferp:BillingDocument, pii: false}
  billed_amount_eur: {physical_name: billed_amount, concept: ciferp:BillingDocument, pii: false}
normalization:
  products:
    MOTOR: ciferp:ProductAutomotive
    MTR: ciferp:ProductAutomotive
    ciferp:ProductAutomotive: ciferp:ProductAutomotive
    HOME: ciferp:ProductCommercial
  statuses:
    COMPTABILISE: POSTED
    RAPPROCHE: CLEARED
    REVERSED: REVERSED
    ANNULE: REVERSED
    DOUBLON: DUPLICATE
    POSTED: POSTED
    CLEARED: CLEARED
    DUPLICATE: DUPLICATE
  order_statuses:
    EN_COURS: RELEASED
    CLOTURE: CLOSED
    ANNULE: CANCELLED
    RELEASED: RELEASED
    CLOSED: CLOSED
    CANCELLED: CANCELLED
lineage:
  physical_sources:
    - databricks://sap_erp_france.erp_acdoca_financials
    - databricks://sap_erp_france.erp_sales_order
  semantic_target: SAP ERP vocabulary 1.0.0
