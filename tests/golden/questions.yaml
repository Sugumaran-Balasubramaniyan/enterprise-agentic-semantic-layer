version: "1.0.0"
owner: GlobalSure Insurance Group
questions:
  - id: primary-claims
    question: Find French motor-insurance customers with at least three qualifying claims in the last 12 months and total incurred loss above EUR 20,000.
    role: ClaimsAnalystFR
    expected: &primary
      concepts: [insurance:Claim, insurance:Customer, insurance:IncurredLoss, insurance:MotorInsurance, insurance:QualifyingClaim]
      relationships:
        - insurance:Customer|insurance:ownsPolicy|insurance:Policy
        - insurance:Policy|insurance:submitsClaim|insurance:Claim
      products: [Customer360, PolicyMaster, ClaimsAnalytics]
      metrics: [insurance:ClaimCount, insurance:TotalIncurredLoss]
      authorization: {allowed: true, reason_code: ALLOWED}
      deterministic:
        answer:
          - {customer_id: FR_001, country: FR, claim_count: 3, total_incurred_loss_eur: 24000.0}
          - {customer_id: FR_002, country: FR, claim_count: 3, total_incurred_loss_eur: 25000.0}
