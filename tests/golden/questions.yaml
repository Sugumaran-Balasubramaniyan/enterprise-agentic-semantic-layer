  - id: secondary-01-active-french
    question: How many French motor insurance customers have active policies this year?
    role: ClaimsAnalystFR
    expected:
      concepts: [sap:ActiveSalesOrder, sap:BusinessPartner, sap:ProductAutomotive, sap:SalesOrder]
      relationships: [sap:BusinessPartner|sap:hasSalesOrder|sap:SalesOrder]
      products: [BusinessPartners, SalesOrders]
      metrics: [sap:ActiveSalesOrderCount]
      authorization: {allowed: true, reason_code: ALLOWED}
      deterministic: {answer_constraints: {mode: discovery_only, rule: sap:ActiveSalesOrder, required_metrics: [sap:ActiveSalesOrderCount]}}
  - id: secondary-02-ratio-french
    question: Show the claims ratio for French motor insurance customers in the current year.
    role: ClaimsManagerGroup
    expected:
      concepts: [sap:BusinessPartner, sap:FinancialPosting, sap:ProductAutomotive]
      relationships:
        - sap:BusinessPartner|sap:hasSalesOrder|sap:SalesOrder
        - sap:BusinessPartner|sap:hasFinancialPosting|sap:FinancialPosting
        - sap:FinancialPosting|sap:referencesSalesOrder|sap:SalesOrder
      products: [BusinessPartners, SalesOrders, ACDOCAFinancials, BillingAnalytics]
      metrics: [sap:CostRevenueRatio]
      authorization: {allowed: false, reason_code: PRODUCT_DENIED}
      deterministic: {answer_constraints: {mode: discovery_only, metric: sap:CostRevenueRatio, required_rules: [sap:QualifyingPosting]}}
