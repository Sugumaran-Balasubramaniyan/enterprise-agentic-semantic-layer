version: "1.0.0"
owner: SAP SE
questions:
  - id: primary-claims
    question: Find French motor-insurance customers with at least three qualifying claims in the last 12 months and total incurred loss above EUR 20,000.
    role: ClaimsAnalystFR
    expected: &primary
      concepts: [sap:BusinessPartner, sap:FinancialLoss, sap:FinancialPosting, sap:ProductAutomotive, sap:QualifyingPosting]
      relationships:
        - sap:BusinessPartner|sap:hasSalesOrder|sap:SalesOrder
        - sap:BusinessPartner|sap:hasFinancialPosting|sap:FinancialPosting
        - sap:FinancialPosting|sap:referencesSalesOrder|sap:SalesOrder
      products: [BusinessPartners, SalesOrders, ACDOCAFinancials]
      metrics: [sap:PostingCount, sap:TotalDebitLossEur]
      authorization: {allowed: true, reason_code: ALLOWED}
      deterministic:
        answer:
          - {partner_id: FR_001, country: FR, posting_count: 3, total_debit_loss_eur: 24000.0}
          - {partner_id: FR_002, country: FR, posting_count: 3, total_debit_loss_eur: 25000.0}
