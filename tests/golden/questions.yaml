  - id: secondary-01-active-french
    question: How many French motor insurance customers have active policies this year?
    role: ClaimsAnalystFR
    expected:
      concepts: [insurance:ActivePolicy, insurance:Customer, insurance:MotorInsurance, insurance:Policy]
      relationships: [insurance:Customer|insurance:ownsPolicy|insurance:Policy]
      products: [Customer360, PolicyMaster]
      metrics: [insurance:ActivePolicyCount]
      authorization: {allowed: true, reason_code: ALLOWED}
      deterministic: {answer_constraints: {mode: discovery_only, rule: insurance:ActivePolicy}}
  - id: secondary-02-ratio-french
    question: Show the claims ratio for French motor insurance customers in the current year.
    role: ClaimsManagerGroup
    expected:
      concepts: [insurance:Claim, insurance:Customer, insurance:MotorInsurance]
      relationships:
        - insurance:Customer|insurance:ownsPolicy|insurance:Policy
        - insurance:Policy|insurance:submitsClaim|insurance:Claim
      products: [Customer360, PolicyMaster, ClaimsAnalytics, PremiumAnalytics]
      metrics: [insurance:ClaimsRatio]
      authorization: {allowed: false, reason_code: PRODUCT_DENIED}
      deterministic: {answer_constraints: {mode: discovery_only, metric: insurance:ClaimsRatio}}
