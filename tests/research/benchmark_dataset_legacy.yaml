  # Tier 1: Single-Hop Factoid & Direct Entity Lookup (8 queries)
  # =========================================================================
  - id: "Q01"
    tier: 1
    category: "single_hop_alert"
    question: "Which SAP Notes directly resolve alert DBSQL_NO_MORE_CONNECTION?"
    expected_notes: ["3345100"]
    requires_reflection: false

  - id: "Q02"
    tier: 1
    category: "single_hop_alert"
    question: "Find notes resolving runtime dump TSV_TNEW_PAGE_ALLOC_FAILED."
    expected_notes: ["3109922", "2765001"]
    requires_reflection: false

  - id: "Q03"
