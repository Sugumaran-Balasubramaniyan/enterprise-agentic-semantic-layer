# SAP-KGBench: Benchmark Dataset for Enterprise Support Knowledge Graphs & Autonomous Query Reasoning
# Benchmark evaluation corpus containing 40 golden natural language queries paired with expected note numbers,
# ground truth SPARQL templates, and query complexity tiers.

benchmark_metadata:
  name: "SAP-KGBench"
  version: "1.0.0"
  domain: "SAP Service & Support Enterprise Knowledge Graph"
  target_ontologies:
    - "PPMS (Product & Product Version Management System)"
    - "SAP Support (Notes, Alerts, Components, SimCat)"
  total_queries: 40

queries:
