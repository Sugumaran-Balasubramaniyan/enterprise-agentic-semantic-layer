version: "1.0.0"
owner: SAP SE
metrics:
  - id: ciferp:PostingCount
    name: PostingCount
    version: "1.0.0"
    definition: Number of distinct qualifying financial journal postings in the selected time context.
    concept: ciferp:QualifyingPosting
    expression: COUNT(DISTINCT journal_entry_id)
    aggregation: count_distinct
    unit: postings
    filter_rule: ciferp:QualifyingPosting
    source_products: [ACDOCAFinancials]
  - id: ciferp:TotalDebitLossEur
    name: TotalDebitLossEur
    version: "1.0.0"
    definition: Sum of financial write-off / debit loss for distinct qualifying postings in the selected time context.
    concept: ciferp:FinancialLoss
    expression: SUM(amount_in_company_currency_eur)
    aggregation: sum
    unit: EUR
    filter_rule: ciferp:QualifyingPosting
    source_products: [ACDOCAFinancials]
  - id: ciferp:AveragePostingAmountEur
    name: AveragePostingAmountEur
    version: "1.0.0"
    definition: Average financial loss per distinct qualifying journal posting.
    concept: ciferp:FinancialLoss
    expression: SUM(amount_in_company_currency_eur) / NULLIF(COUNT(DISTINCT journal_entry_id), 0)
    aggregation: average
    unit: EUR per posting
    filter_rule: ciferp:QualifyingPosting
    source_products: [ACDOCAFinancials]
  - id: ciferp:ActiveSalesOrderCount
    name: ActiveSalesOrderCount
    version: "1.0.0"
    definition: Number of sales orders whose governed lifecycle status is RELEASED.
    concept: ciferp:ActiveSalesOrder
    expression: COUNT(DISTINCT sales_order_id) WHERE order_status = 'RELEASED'
    aggregation: count_distinct
    unit: orders
    filter_rule: ciferp:ActiveSalesOrder
    source_products: [SalesOrders]
  - id: ciferp:CostRevenueRatio
    name: CostRevenueRatio
    version: "1.0.0"
    definition: Separately aggregated qualifying financial loss divided by separately aggregated billed revenue for the same aligned scope.
    concept: ciferp:FinancialLoss
    expression: loss_aggregate.total_debit_loss_eur / NULLIF(revenue_aggregate.total_billed_amount_eur, 0)
    aggregation: ratio_of_aggregates
    unit: ratio
    filter_rule: ciferp:QualifyingPosting
    source_products: [ACDOCAFinancials, BillingAnalytics]
    dependencies: [ciferp:TotalDebitLossEur]
    numerator:
      product: ACDOCAFinancials
      measure: amount_in_company_currency_eur
      aggregation: SUM
      filter_rule: ciferp:QualifyingPosting
      aggregate_name: total_debit_loss_eur
    denominator:
      product: BillingAnalytics
      measure: billed_amount_eur
      aggregation: SUM
      aggregate_name: total_billed_amount_eur
      filter_context: selected billing periods for the same scope
    alignment:
      dimensions: [partner_id, country, product]
      join_keys: [partner_id, country, product]
      time_context: same caller-selected as_of and reporting window, applied independently to posting_date and billing_date
      pre_aggregate_each_product: true
      join_multiplication: forbidden
