id: SalesOrders
name: Sales Orders (VBAK/VBAP)
version: "1.0.0"
owner: repository-maintained synthetic contract
platform: Local synthetic reference
location: Repository
grain: one row per sales order
sla: not applicable to synthetic repository data
classification: Confidential
pii:
  - partner_id
quality:
  status: CERTIFIED
  checks:
    - sales_order_id is non-null and unique
    - partner_id references BusinessPartners
    - order_status is RELEASED, CLOSED, or CANCELLED
    - product resolves through an approved local mapping
lineage:
  upstream:
    - local S/4HANA Sales systems in France, United Kingdom, and Germany
  transformations:
    - local material codes are normalized to SAP product taxonomy
    - local order lifecycle values are normalized to the Group status vocabulary
concepts:
  - ciferp:SalesOrder
  - ciferp:ActiveSalesOrder
  - ciferp:Product
  - ciferp:ProductAutomotive
schema:
  - name: sales_order_id
    type: string
    concept: ciferp:SalesOrder
    nullable: false
  - name: partner_id
    type: string
    concept: ciferp:BusinessPartner
    nullable: false
    pii: true
  - name: country
    type: string
    concept: ciferp:CompanyCode
    nullable: false
  - name: product
    type: string
    concept: ciferp:Product
    nullable: false
  - name: order_status
    type: string
    concept: ciferp:SalesOrder
    nullable: false
  - name: effective_date
    type: date
    concept: ciferp:SalesOrder
    nullable: false
  - name: expiry_date
    type: date
    concept: ciferp:SalesOrder
    nullable: false
  - name: net_value_eur
    type: decimal
    concept: ciferp:BillingDocument
    nullable: false
certification:
  status: CERTIFIED
  certified_by: repository-maintained synthetic contract
  certified_at: "2026-08-28"
