id: BillingAnalytics
name: Billing Analytics (VBRK/VBRP)
version: "1.0.0"
owner: SAP SE Billing and Revenue Management
platform: Federated
location: Group
grain: one row per billing document
sla: daily by 07:00 UTC
classification: Confidential
pii:
  - partner_id
quality:
  status: CERTIFIED
  checks:
    - billing_doc_id is non-null and unique
    - billed_amount_eur is non-negative
    - sales_order_id references SalesOrders
    - product resolves through a certified local mapping
lineage:
  upstream:
    - local S/4HANA billing engines in France, United Kingdom, and Germany
  transformations:
    - billing amounts are conformed to EUR company currency
    - local product codes are normalized to SAP product taxonomy
concepts:
  - sap:BillingDocument
  - sap:SalesOrder
  - sap:BusinessPartner
  - sap:Product
schema:
  - name: billing_doc_id
    type: string
    concept: sap:BillingDocument
    nullable: false
  - name: sales_order_id
    type: string
    concept: sap:SalesOrder
    nullable: false
  - name: partner_id
    type: string
    concept: sap:BusinessPartner
    nullable: false
    pii: true
  - name: country
    type: string
    concept: sap:CompanyCode
    nullable: false
  - name: product
    type: string
    concept: sap:Product
    nullable: false
  - name: billing_date
    type: date
    concept: sap:BillingDocument
    nullable: false
  - name: billed_amount_eur
    type: decimal
    concept: sap:BillingDocument
    nullable: false
certification:
  status: CERTIFIED
  certified_by: SAP Enterprise Financial Governance Board
  certified_at: "2026-08-28"
