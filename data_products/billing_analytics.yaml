id: BillingAnalytics
name: Billing Analytics (VBRK/VBRP)
version: "1.0.0"
owner: repository-maintained synthetic contract
platform: Local synthetic reference
location: Repository
grain: one row per billing document
sla: not applicable to synthetic repository data
classification: Confidential
pii:
  - partner_id
quality:
  status: CERTIFIED
  checks:
    - billing_doc_id is non-null and unique
    - billed_amount_eur is non-negative
    - sales_order_id references SalesOrders
    - product resolves through an approved local mapping
lineage:
  upstream:
    - local S/4HANA billing engines in France, United Kingdom, and Germany
  transformations:
    - billing amounts are conformed to EUR company currency
    - local product codes are normalized to SAP product taxonomy
concepts:
  - ciferp:BillingDocument
  - ciferp:SalesOrder
  - ciferp:BusinessPartner
  - ciferp:Product
schema:
  - name: billing_doc_id
    type: string
    concept: ciferp:BillingDocument
    nullable: false
  - name: sales_order_id
    type: string
    concept: ciferp:SalesOrder
    nullable: false
  - name: partner_id
    type: string
    concept: ciferp:BusinessPartner
    nullable: false
    pii: true
  - name: country
    type: string
    concept: ciferp:CompanyCode
    nullable: false
  - name: product
    type: string
    concept: ciferp:Product
    nullable: false
  - name: billing_date
    type: date
    concept: ciferp:BillingDocument
    nullable: false
  - name: billed_amount_eur
    type: decimal
    concept: ciferp:BillingDocument
    nullable: false
certification:
  status: CERTIFIED
  certified_by: repository-maintained synthetic contract
  certified_at: "2026-08-28"
