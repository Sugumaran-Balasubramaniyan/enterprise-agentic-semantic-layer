id: ACDOCAFinancials
name: Universal Journal Financials (ACDOCA)
version: "1.0.0"
owner: repository-maintained synthetic contract
platform: Local synthetic reference
location: Repository
grain: one row per financial posting
sla: not applicable to synthetic repository data
classification: Restricted
pii:
  - partner_id
quality:
  status: CERTIFIED
  checks:
    - journal_entry_id is non-null and unique in the curated relation
    - posting_date is non-null and not in the future as of the query context
    - amount_in_company_currency_eur is non-negative
    - posting_status and country use governed values
    - product resolves through an approved local mapping
lineage:
  upstream:
    - local S/4HANA FI-GL/FI-AP/FI-AR engines in France, United Kingdom, and Germany
  transformations:
    - journal items are conformed to SalesOrders by sales_order_id
    - local accounting statuses and materials are normalized to SAP ERP semantics
    - REVERSED and DUPLICATE entries remain observable but are excluded by QualifyingPosting
concepts:
  - ciferp:FinancialPosting
  - ciferp:QualifyingPosting
  - ciferp:FinancialLoss
  - ciferp:PostingStatus
  - ciferp:SalesOrder
  - ciferp:BusinessPartner
schema:
  - name: journal_entry_id
    type: string
    concept: ciferp:FinancialPosting
    nullable: false
  - name: sales_order_id
    type: string
    concept: ciferp:SalesOrder
    nullable: false
  - name: partner_id
    type: string
    concept: ciferp:BusinessPartner
    nullable: false
    pii: true
  - name: country
    type: string
    concept: ciferp:CompanyCode
    nullable: false
  - name: product
    type: string
    concept: ciferp:Product
    nullable: false
  - name: posting_status
    type: string
    concept: ciferp:PostingStatus
    nullable: false
  - name: posting_date
    type: date
    concept: ciferp:FinancialPosting
    nullable: false
  - name: amount_in_company_currency_eur
    type: decimal
    concept: ciferp:FinancialLoss
    nullable: false
certification:
  status: CERTIFIED
  certified_by: repository-maintained synthetic contract
  certified_at: "2026-08-28"
