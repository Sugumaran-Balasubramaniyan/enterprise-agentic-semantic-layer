id: BusinessPartners
name: Business Partner Master (BUT000)
version: "1.0.0"
owner: SAP SE Master Data Governance
platform: Federated
location: Group
grain: one row per business partner
sla: daily by 06:00 UTC
classification: Restricted
pii:
  - partner_id
  - partner_name
  - email
quality:
  status: CERTIFIED
  checks:
    - partner_id is non-null and unique
    - country is one of FR, GB, DE
    - email is classified personal data and access controlled
lineage:
  upstream:
    - local S/4HANA systems in France, United Kingdom, and Germany
  transformations:
    - country codes are normalized to SAP company code jurisdictions
concepts:
  - ciferp:BusinessPartner
  - ciferp:CompanyCode
schema:
  - name: partner_id
    type: string
    concept: ciferp:BusinessPartner
    nullable: false
  - name: partner_name
    type: string
    concept: ciferp:BusinessPartner
    nullable: false
  - name: country
    type: string
    concept: ciferp:CompanyCode
    nullable: false
  - name: email
    type: string
    concept: ciferp:BusinessPartner
    nullable: false
    pii: true
certification:
  status: CERTIFIED
  certified_by: SAP Enterprise Data Governance Board
  certified_at: "2026-08-28"
